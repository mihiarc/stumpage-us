# Monthly link-rot sweep over the source catalogue in src/content/directory.ts.
#
# This is a rot detector, not a monitor: it answers "has a report we catalogue
# quietly disappeared since we last looked", which is a question with a
# months-long time constant. Running it more often would just cost more
# requests to other people's servers.
#
# It reports into a single living GitHub issue and **never fails**. A red X on
# an unfunded repo becomes background noise within two runs, and a transient
# 503 on somebody else's web server must never look like a broken build. The
# checker's own three-valued classification (ok / unverifiable / dead) is what
# keeps the signal honest — see the header comment in scripts/check-links.ts.
#
# It has no write access to the repository contents on purpose. `status` and
# `verified` in src/content/directory.ts are editorial judgments about whether
# a publisher is still maintaining a report; HTTP cannot see that, and a robot
# silently "correcting" them would destroy the distinction the catalogue exists
# to make.
name: Link check

on:
  schedule:
    # 09:00 UTC on the 1st of each month.
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Directory link check: catalogue URLs needing a human"
      ISSUE_LABEL: link-rot
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Always succeeds; findings land in .link-check/.
      - name: Sweep catalogue URLs
        run: bun run check:links

      - name: Report findings
        run: |
          set -euo pipefail

          actionable=$(cat .link-check/actionable)
          fingerprint=$(cat .link-check/fingerprint)

          # Idempotent: the label may or may not exist yet.
          gh label create "$ISSUE_LABEL" \
            --description "Catalogue URLs that stopped resolving or moved" \
            --color D93F0B 2>/dev/null || true

          existing=$(gh issue list --label "$ISSUE_LABEL" --state open \
            --json number --jq '.[0].number // empty')

          if [ "$actionable" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body \
                "Automated sweep on $(date -u +%Y-%m-%d) found no dead or moved URLs. Closing."
              gh issue close "$existing"
              echo "All clear — closed #$existing."
            else
              echo "All clear — nothing to report."
            fi
            exit 0
          fi

          if [ -z "$existing" ]; then
            # `gh issue create` prints the new issue's URL, not JSON.
            url=$(gh issue create \
              --title "$ISSUE_TITLE" \
              --label "$ISSUE_LABEL" \
              --body-file .link-check/report.md)
            echo "Opened $url with $actionable finding(s)."
            exit 0
          fi

          # An open issue already covers this. Refresh the body either way, but
          # only comment when the findings themselves changed — a monthly ping
          # repeating the same two dead links is how a checker gets muted.
          previous=$(gh issue view "$existing" --json body --jq .body \
            | sed -n 's/.*<!-- link-check-fingerprint: \([0-9a-f]*\) -->.*/\1/p')

          gh issue edit "$existing" --body-file .link-check/report.md

          if [ "$previous" = "$fingerprint" ]; then
            echo "Findings unchanged since the last run; updated #$existing quietly."
          else
            gh issue comment "$existing" --body \
              "Findings changed as of $(date -u +%Y-%m-%d) — $actionable item(s) now need a look. Body updated above."
            echo "Findings changed; commented on #$existing."
          fi
