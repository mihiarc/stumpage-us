name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project-pages sub-path; drop this (set to "") when the custom domain
      # (stumpage.us) is attached. Must match next.config.ts basePath and
      # src/lib/asset.ts. See "Attaching the stumpage.us domain" in README.md —
      # the CNAME file and this value have to change in the same commit.
      NEXT_PUBLIC_BASE_PATH: /stumpage-us
      # Cloudflare Web Analytics beacon token. A public write-only identifier,
      # not a secret — it ships in the HTML. Empty means no analytics, and
      # /privacy renders accordingly. Set it once the domain is live, since
      # measuring the github.io sub-path would just split the record in two.
      NEXT_PUBLIC_CF_BEACON_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
